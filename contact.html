<!DOCTYPE html>
<html>
<head>
<title>Contact Codext™</title>

<meta name="description" content="Contact Codext for professional websites, technology support, cybersecurity education, and Google Business setup.">

<link rel="icon" type="image/png" href="Favicon.png">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    color: #222;
}

header {
    background: #111827;
    color: white;
    padding: 25px;
    text-align: center;
}

header h1 {
    font-size: 45px;
}

.container {
    max-width: 600px;
    margin: 40px auto;
    background: white;
    padding: 30px;
    border-radius: 12px;
}

input, textarea, select {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 16px;
}

textarea {
    height: 120px;
}

button {
    background: #2563eb;
    color: white;
    border: none;
    padding: 14px 25px;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

a {
    color: white;
    text-decoration: none;
}
</style>

</head>

<body>

<header>
    <h1>Contact Codext™</h1>
    <p>Technology Made Simple</p>
</header>


<div class="container">

<h2>Send a Message</h2>

<form action="https://formspree.io/f/xrenrbga" method="POST">

<input type="text" name="name" placeholder="Your Name" required>

<input type="email" name="email" placeholder="Your Email" required>

<input type="text" name="business" placeholder="Business Name" required>

<select name="package">
    <option value="" disabled selected>Choose a Website Package</option>
    <option value="Starter - $80">Starter - $80</option>
    <option value="Business - $120">Business - $120</option>
    <option value="Premium - $200">Premium - $200</option>
</select>

<select name="service">
    <option value="" disabled selected>Choose Another Service (Optional)</option>

    <option value="Website Maintenance - From $15/month">
        Website Maintenance - From $15/month
    </option>

    <option value="Website Updates & Improvements - From $30">
        Website Updates & Improvements - From $30
    </option>

    <option value="Basic SEO Setup - $50">
        Basic SEO Setup - $50
    </option>

    <option value="Google Business Profile Setup - $40">
        Google Business Profile Setup - $40
    </option>

    <option value="Google Business Profile Optimization - $40">
        Google Business Profile Optimization - $40
    </option>

    <option value="Business Email Setup - $35">
        Business Email Setup - $35
    </option>

    <option value="Small Team Cybersecurity Training - $100">
        Small Team Cybersecurity Training - $100
    </option>

    <option value="Business Security Package - $250">
        Business Security Package - $250
    </option>

    <option value="Company Protection Plan - $500">
        Company Protection Plan - $500
    </option>

</select>

<select name="business_type" required>
    <option value="" disabled selected>Choose Your Business Type</option>
    <option value="Restaurant / Food">Restaurant / Food</option>
    <option value="Home Services">Home Services</option>
    <option value="Retail / Shop">Retail / Shop</option>
    <option value="Professional Services">Professional Services</option>
    <option value="Organization">Organization</option>
    <option value="Technology">Technology</option>
    <option value="Creative / Freelancer">Creative / Freelancer</option>
    <option value="Other">Other</option>
</select>

<div id="pages-field" style="display: none;">
    <input
        type="text"
        name="pages"
        id="pages"
        placeholder="What pages do you want? (Example: Home, About, Services, Contact)"
    >
</div>

<textarea name="message" placeholder="Tell us what you need"></textarea>

<textarea name="additional_info" placeholder="Anything else you'd like Codext™ to know?"></textarea>

<button type="submit">Send Message</button>


</form>

</div>

<script>
const packageSelect = document.querySelector('select[name="package"]');
const pagesField = document.getElementById('pages-field');
const pagesInput = document.getElementById('pages');

packageSelect.addEventListener('change', function () {
    if (this.value !== "") {
        pagesField.style.display = "block";
    } else {
        pagesField.style.display = "none";
        pagesInput.value = "";
    }
});
</script>
    
</body>
</html>
