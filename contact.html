<!DOCTYPE html>
<html>
<head>
<title>Contact Codext™</title>

<meta name="description" content="Contact Codext for professional websites, technology support, cybersecurity education, and Google Business setup.">

<link rel="icon" type="image/png" href="Favicon.png">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    color: #222;
}

header {
    background: #111827;
    color: white;
    padding: 25px;
    text-align: center;
}

header h1 {
    font-size: 45px;
}

.container {
    max-width: 600px;
    margin: 40px auto;
    background: white;
    padding: 30px;
    border-radius: 12px;
}

input, textarea, select {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 16px;
}

textarea {
    height: 120px;
}

button {
    background: #2563eb;
    color: white;
    border: none;
    padding: 14px 25px;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

a {
    color: white;
    text-decoration: none;
}

.cancel-option {
    color: red;
}

footer {
    background: #111827;
    color: white;
    text-align: center;
    padding: 25px;
    margin-top: 40px;
}

footer nav {
    margin: 15px 0;
}

footer a {
    color: white;
    text-decoration: none;
    margin: 0 8px;
}

footer a:hover {
    text-decoration: underline;
}

</style>

</head>

<body>

<header>
    <h1>Contact Codext™</h1>
    <p>Technology Made Simple</p>
</header>


<div class="container">

<h2>Send a Message</h2>

<form action="https://formspree.io/f/xrenrbga" method="POST">

<h3>Your Information</h3>

<input type="text" name="name" placeholder="Your Name" required>

<input type="email" name="email" placeholder="Your Email" required>

<input type="text" name="business" placeholder="Business Name" required>


<h3>What Do You Need?</h3>

<select name="package">
    <option value="" selected>Choose a Website Package</option>
    <option value="none" class="cancel-option">Cancel / No Website Package</option>
    <option value="Starter - $80">Starter - $80</option>
    <option value="Business - $120">Business - $120</option>
    <option value="Premium - $200">Premium - $200</option>
</select>

<select name="service">
    <option value="" disabled selected>Choose Another Service</option>
    <option value="none" class="cancel-option">Cancel / No Additional Service</option>

    <option value="Website Maintenance - From $15/month">Website Maintenance - From $15/month</option>
    <option value="Website Updates & Improvements - From $30">Website Updates & Improvements - From $30</option>
    <option value="Basic SEO Setup - $50">Basic SEO Setup - $50</option>
    <option value="Google Business Profile Setup - $40">Google Business Profile Setup - $40</option>
    <option value="Google Business Profile Optimization - $40">Google Business Profile Optimization - $40</option>
    <option value="Business Email Setup - $35">Business Email Setup - $35</option>
    <option value="Small Team Cybersecurity Training - $100">Small Team Cybersecurity Training - $100</option>
    <option value="Business Security Package - $250">Business Security Package - $250</option>
    <option value="Company Protection Plan - $500">Company Protection Plan - $500</option>
</select>

<select name="business_type" required>
    <option value="" disabled selected>Choose Your Business Type</option>
    <option value="none" class="cancel-option">None</option>

    <option value="Restaurant / Food">Restaurant / Food</option>
    <option value="Home Services">Home Services</option>
    <option value="Retail / Shop">Retail / Shop</option>
    <option value="Professional Services">Professional Services</option>
    <option value="Organization">Organization</option>
    <option value="Technology">Technology</option>
    <option value="Creative / Freelancer">Creative / Freelancer</option>
    <option value="Other">Other</option>
</select>


<div id="website-details" style="display: none;">

<h3>Website Details</h3>

<div id="pages-field">
    <input
    type="text"
    name="pages"
    id="pages"
    placeholder="What pages do you want? (Example: Home, About, Services, Contact)"
>
</div>

</div>


<h3>Tell Us More</h3>

<textarea name="message" placeholder="Tell us what you need"></textarea>

<textarea name="additional_info" placeholder="Anything else you'd like Codext™ to know?"></textarea>

<button type="submit">Send Message</button>

</form>

</div>

<footer>

    <p>© 2026 Codext™ • Technology Made Simple</p>

    <nav>
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="about.html">About</a>
        <a href="faq.html">FAQ</a>
        <a href="contact.html">Contact</a>
    </nav>

    <p>
        📞 <a href="tel:+14169976400">Contact Codext™</a>
        &nbsp;&nbsp;
        🔗 <a href="https://www.linkedin.com/in/hounam-alizadeh">LinkedIn</a>
        &nbsp;&nbsp;
        💻 <a href="https://github.com/HackerWhoTrys">GitHub</a>
    </p>

</footer>

<script>
const packageSelect = document.querySelector('select[name="package"]');
const websiteDetails = document.getElementById('website-details');
const pagesInput = document.getElementById('pages');

packageSelect.addEventListener('change', function () {
    if (this.value === "" || this.value === "none") {
        websiteDetails.style.display = "none";
        pagesInput.value = "";
    } else {
        websiteDetails.style.display = "block";
    }
});
</script>
    
</body>
</html>
