<!DOCTYPE html>
<html>
<head>
<title>Contact Codext</title>

<link rel="icon" type="image/png" href="logo.png">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    color: #222;
}

header {
    background: #111827;
    color: white;
    padding: 25px;
    text-align: center;
}

header h1 {
    font-size: 45px;
}

.container {
    max-width: 600px;
    margin: 40px auto;
    background: white;
    padding: 30px;
    border-radius: 12px;
}

input, textarea {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 16px;
}

textarea {
    height: 120px;
}

button {
    background: #2563eb;
    color: white;
    border: none;
    padding: 14px 25px;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

a {
    color: white;
    text-decoration: none;
}
</style>

</head>

<body>

<header>
    <h1>Contact Codext</h1>
    <p>Technology Made Simple</p>
</header>


<div class="container">

<h2>Send a Message</h2>

<form action="https://formspree.io/f/xrenrbga" method="POST">

<input type="text" name="name" placeholder="Your Name" required>

<input type="email" name="email" placeholder="Your Email" required>

<input type="text" name="service" placeholder="What service are you interested in?">

<textarea name="message" placeholder="Tell us what you need"></textarea>

<button type="submit">Send Message</button>

</form>

</div>

</body>
</html>
